project:
  type: website
  resources:
    - assets/

website:
  title: "iabhyuday"
  site-url: https://iabhyuday.github.io
  description: "Hard ideas, built up from first principles, one step at a time. By Abhyuday Tripathi."
  favicon: favicon.svg
  open-graph: true
  twitter-card:
    creator: "@abhyu97"
  navbar:
    right:
      - text: Posts
        href: index.qmd
      - text: About
        href: about.qmd
      - icon: linkedin
        href: https://www.linkedin.com/in/iabhyuday
        aria-label: LinkedIn
      - icon: twitter-x
        href: https://x.com/abhyu97
        aria-label: X (Twitter)
      - icon: rss
        href: index.xml
        aria-label: RSS feed
  page-footer:
    left: "© 2026 Abhyuday Tripathi"
    right:
      - text: "Book a 1:1 on Topmate"
        href: https://topmate.io/abhyuday_tripathi
      - text: "RSS"
        href: index.xml
      - text: "Built with Quarto"
        href: https://quarto.org

format:
  html:
    theme:
      dark: [darkly, distill-dark.scss]
      light: [flatly, distill-light.scss]
    css: styles.css
    toc: false
    include-after-body: toc-rail.html
    grid:
      body-width: 704px
